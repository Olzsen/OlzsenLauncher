name: Build Windows setup executable

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "frontend/**"
      - "package.json"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows app icon
        run: npx tauri icon src-tauri/icons/hearth.svg --output src-tauri/icons
      - name: Build NSIS installer
        run: npm run build
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HearthLauncher-setup-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

